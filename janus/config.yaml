name: "Janus"
version: "1.0.21"
slug: "janus"
description: "AI-orchestrated residential estate operating system and command deck."
url: "https://github.com/tonysafoian/janus-home-app"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 5080
panel_icon: "mdi:shield-home"
panel_title: "Janus"
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: "default"
host_network: false
options:
  log_level: "info"
  enable_demo_login: false
  enable_mock_mode: false
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  enable_demo_login: "bool?"
  enable_mock_mode: "bool?"
  home_location: "str?"
  home_lat: "float?"
  home_lng: "float?"
  electricity_rate_per_kwh: "float?"
  staff_emails: "str?"
  assistant_email: "str?"
  computer_admin_token: "password?"
  cron_secret: "password?"
  enable_goaccess: "bool?"
  openrouter_api_key: "password?"
  gemini_api_key: "password?"
  anthropic_api_key: "password?"
  openai_api_key: "password?"
  google_client_id: "str?"
  google_client_secret: "password?"
  google_service_account_key: "password?"
  google_maps_api_key: "password?"
  perplexity_api_key: "password?"
  firecrawl_api_key: "password?"
  elevenlabs_api_key: "password?"
  fal_api_key: "password?"
  resend_api_key: "password?"
  wati_api_key: "password?"
  wati_access_token: "password?"
  wati_tenant_id: "str?"
  wati_api_endpoint: "str?"
  wati_phone_number: "str?"
  alert_phone_number: "str?"
  fortigate_host: "str?"
  fortigate_api_key: "password?"
  fortigate_base_url: "str?"
  fortigate_api_token: "password?"
  ruckus_host: "str?"
  ruckus_base_url: "str?"
  ruckus_username: "str?"
  ruckus_password: "password?"
  verkada_api_key: "password?"
  verkada_org_id: "str?"
  iaqualink_api_key: "password?"
  iaqualink_username: "str?"
  iaqualink_password: "password?"
  notion_api_key: "password?"
  tesla_client_id: "str?"
  tesla_client_secret: "password?"
  govee_api_key: "password?"
  database_url: "str?"
  app_domain: "str?"
  admin_email: "str?"
